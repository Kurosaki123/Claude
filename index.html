<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World!</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating particles */
  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    bottom: -50px;
    width: 6px;
    height: 6px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    animation: rise linear infinite;
  }

  @keyframes rise {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-110vh) translateX(var(--drift, 0px));
      opacity: 0;
    }
  }

  .card {
    position: relative;
    text-align: center;
    padding: 4rem 5rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    z-index: 1;
    animation: floatCard 6s ease-in-out infinite;
  }

  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede, #ff6ec4);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
    text-shadow: 0 0 60px rgba(120, 115, 245, 0.3);
  }

  @keyframes shine {
    to { background-position: 300% center; }
  }

  .subtitle {
    margin-top: 1rem;
    color: rgba(255, 255, 255, 0.6);
    font-size: 1.1rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 300;
  }

  .glow-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 8px;
    border-radius: 50%;
    background: #4adede;
    box-shadow: 0 0 12px 4px rgba(74, 222, 222, 0.7);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: 0.5; }
  }

  nav {
    position: fixed;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 10;
  }

  nav a {
    padding: 0.55rem 1.4rem;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 1px;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  nav a:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  nav a.active {
    color: #0f0c29;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede);
    box-shadow: 0 0 20px rgba(120, 115, 245, 0.5);
  }
</style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="card">
    <h1>Hello, World!</h1>
    <div class="subtitle">
      <span class="glow-dot"></span>
      Welcome to the Web
      <span class="glow-dot"></span>
    </div>
  </div>

  <script>
    const container = document.getElementById('particles');
    const count = 40;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(p);
    }
  </script>

</body>
</html>
