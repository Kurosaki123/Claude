<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
    padding: 2rem;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    bottom: -50px;
    width: 6px;
    height: 6px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    animation: rise linear infinite;
  }

  @keyframes rise {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-110vh) translateX(var(--drift, 0px));
      opacity: 0;
    }
  }

  nav {
    position: fixed;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 10;
  }

  nav a {
    padding: 0.55rem 1.4rem;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 1px;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  nav a:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  nav a.active {
    color: #0f0c29;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede);
    box-shadow: 0 0 20px rgba(120, 115, 245, 0.5);
  }

  .card {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 480px;
    padding: 3.5rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    z-index: 1;
    animation: floatCard 6s ease-in-out infinite;
  }

  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  h1 {
    font-size: clamp(2rem, 6vw, 2.8rem);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede, #ff6ec4);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    to { background-position: 300% center; }
  }

  p.lead {
    margin-top: 0.8rem;
    margin-bottom: 2rem;
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.95rem;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    text-align: left;
  }

  label {
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 0.4rem;
    display: block;
  }

  input,
  textarea {
    width: 100%;
    padding: 0.85rem 1rem;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s ease;
    resize: none;
  }

  input::placeholder,
  textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  input:focus,
  textarea:focus {
    border-color: #7873f5;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(120, 115, 245, 0.25);
  }

  textarea {
    min-height: 100px;
  }

  button {
    margin-top: 0.5rem;
    padding: 0.9rem 1rem;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #0f0c29;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede);
    background-size: 200% auto;
    cursor: pointer;
    transition: all 0.4s ease;
  }

  button:hover {
    background-position: right center;
    box-shadow: 0 0 24px rgba(120, 115, 245, 0.6);
    transform: translateY(-2px);
  }

  .status {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: #4adede;
    min-height: 1.2em;
  }
</style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <div class="card">
    <h1>Get in Touch</h1>
    <p class="lead">Have a question or just want to say hi? Drop a line below.</p>

    <form id="contactForm">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" placeholder="Say something nice..." required></textarea>
      </div>
      <button type="submit">Send Message</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const container = document.getElementById('particles');
    const count = 40;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(p);
    }

    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('status').textContent = 'Thanks! This is a demo form — no message was actually sent.';
      this.reset();
    });
  </script>

</body>
</html>
