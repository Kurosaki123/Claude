<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
    padding: 2rem;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    bottom: -50px;
    width: 6px;
    height: 6px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    animation: rise linear infinite;
  }

  @keyframes rise {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-110vh) translateX(var(--drift, 0px));
      opacity: 0;
    }
  }

  nav {
    position: fixed;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 10;
  }

  nav a {
    padding: 0.55rem 1.4rem;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 1px;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  nav a:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  nav a.active {
    color: #0f0c29;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede);
    box-shadow: 0 0 20px rgba(120, 115, 245, 0.5);
  }

  .card {
    position: relative;
    text-align: center;
    max-width: 640px;
    padding: 4rem 3.5rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    z-index: 1;
    animation: floatCard 6s ease-in-out infinite;
  }

  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede, #ff6ec4);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    to { background-position: 300% center; }
  }

  p.lead {
    margin-top: 1.5rem;
    color: rgba(255, 255, 255, 0.75);
    font-size: 1.1rem;
    line-height: 1.7;
    font-weight: 300;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    margin-top: 2.5rem;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat .num {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(90deg, #4adede, #7873f5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .stat .label {
    margin-top: 0.4rem;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
  }

  .divider {
    width: 60px;
    height: 3px;
    margin: 2rem auto 0;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff6ec4, #4adede);
  }
</style>
</head>
<body>

  <div class="particles" id="particles"></div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html" class="active">About</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="card">
    <h1>About This Page</h1>
    <p class="lead">
      This little corner of the web was built to prove a point: even a
      "Hello, World!" can shine. Glassy cards, drifting particles, and
      gradients that never sit still &mdash; all wrapped around three simple pages.
    </p>
    <div class="divider"></div>
    <div class="stats">
      <div class="stat">
        <span class="num">3</span>
        <span class="label">Pages</span>
      </div>
      <div class="stat">
        <span class="num">100%</span>
        <span class="label">Vanilla CSS</span>
      </div>
      <div class="stat">
        <span class="num">&infin;</span>
        <span class="label">Style</span>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('particles');
    const count = 40;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(p);
    }
  </script>

</body>
</html>
